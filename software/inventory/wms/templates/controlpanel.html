<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
    <style>
        /* Style the navigation bar */
        .navbar {
            overflow: hidden;
            background-color: #333;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Style the links inside the navigation bar */
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        /* Change the color of links on hover */
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }

        /* Add a color to the active/current link */
        .navbar a.active {
            background-color: #4CAF50;
            color: white;
        }

        /* Style the return button */
        .return-button {
            float: right;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            background-color: #333;
            cursor: pointer;
        }

        /* Change the color of the return button on hover */
        .return-button:hover {
            background-color: #ddd;
            color: black;
        }

        /* Style the table */
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Define the navigation bar -->
    <div class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'layout' %}" class="active">Layout</a>
        <a href="{% url 'slot' %}" class="active">Slot</a>
        <a href="{% url 'product' %}" class="active">Product</a>
        {% block return_button %}
            <div class="return-button" onclick="window.location.href='{% url 'recall' %}';">Return</div>
        {% endblock %}
    </div>

    <h1>{% block content_title %}{% endblock %}</h1>
    <hr/>
    {% block content %}{% endblock %}

    <p>&copy; {{ year }} std 20192246</p>
</body>
</html>
