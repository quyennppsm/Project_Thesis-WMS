<table>
<thead>
<tr>
    <th>id</th>
    <th>identification</th>
    <th>number</th>
    <th>cost</th>
    <th>price</th>
    <th>profit</th>
    <th>wage</th>
    <th>description</th>
</tr>
</thead>
<tbody>
{% for row in rows %}
<tr>
    <td>{{ row.0 }}</td>
    <td>{{ row.1 }}</td>
    <td>{{ row.2 }}</td>
    <td>{{ row.3 }}</td>
    <td>{{ row.4 }}</td>
    <td>{{ row.5 }}</td>
    <td>{{ row.6 }}</td>
    <td>{{ row.7 }}</td>
</tr>
{% endfor %}
</tbody>
</table>
